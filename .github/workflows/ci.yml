name: CI

on:
  push: 
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci  
      - run: npm run lint
      - run: npx prisma generate
      - run: npm test -- --passWithNoTests

      
      